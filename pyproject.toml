[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-steganography"
version = "0.1.0"
description = "Shared-key linguistic steganography research toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=49,<50",
    "pynacl>=1.6.2,<2",
]

[project.scripts]
steg = "lsteg.cli:main"

[project.optional-dependencies]
model = [
    "torch==2.13.0",
    "transformers==5.15.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lsteg"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "model: requires the pinned local model artifact and optional GPU runtime",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["first.md"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
